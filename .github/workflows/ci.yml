name: Book Illustration Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 1. Starting PostgreSQL Database (Mirroring start.sh step 1)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: gradion_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U admin -d gradion_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Passing the exact database URL Prisma expects
    env:
      PORT: 3000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend
        working-directory: backend
        run: npm ci

      - name: Install Frontend
        working-directory: frontend
        run: npm ci

      - name: Check PostgreSQL
        run: |
          node -e "const net=require('net'); const s=net.connect(5433,'127.0.0.1',()=>{console.log('PostgreSQL OK');s.end()}); s.on('error',e=>{console.error(e);process.exit(1)})"

      - name: Prisma Database Push
        working-directory: backend
        env:
          DATABASE_URL: postgresql://admin:password123@127.0.0.1:5433/gradion_db?schema=public
        run: npx prisma db push

      - name: Backend Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://admin:password123@127.0.0.1:5433/gradion_db?schema=public
        run: npm test

      - name: Frontend Build
        working-directory: frontend
        run: npm run build
